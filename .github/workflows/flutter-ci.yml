name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build release APK artifacts"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Firebase Android configuration
        env:
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          names = ['FIREBASE_ANDROID_API_KEY', 'FIREBASE_ANDROID_APP_ID', 'GOOGLE_SERVER_CLIENT_ID']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure the Firebase Android repository secrets before building an APK.')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dompetku-firebase.json'
          target.write_text(json.dumps({name: os.environ[name] for name in names}))
          PY

      - name: Build split APK
        env:
          DEBUG: ""
        run: flutter build apk --release --split-per-abi --dart-define-from-file="$RUNNER_TEMP/dompetku-firebase.json"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dompet-sheva-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk

<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#081222" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Warm up the two Google hosts the app talks to right after start-up. -->
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

  <!-- Lightweight start-up screen, shown until Flutter paints its first frame. -->
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #F5F8FF;
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #F5F8FF;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #10213D;
    }

    #boot img {
      width: 72px;
      height: 72px;
    }

    #boot .spinner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid rgba(37, 99, 235, .2);
      border-top-color: #2563EB;
      animation: boot-spin .8s linear infinite;
    }

    #boot .slow {
      margin: 0;
      padding: 0 24px;
      text-align: center;
      opacity: 0;
      max-width: 320px;
      animation: boot-slow .3s ease 15s forwards;
    }

    @keyframes boot-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes boot-slow {
      to {
        opacity: .7;
      }
    }

    @media (prefers-color-scheme: dark) {

      html,
      body,
      #boot {
        background: #081222;
        color: #F3F7FF;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot .spinner {
        animation-duration: 2.4s;
      }
    }
  </style>
  <meta name="description" content="Aplikasi keuangan pribadi dengan login Google dan penyimpanan data per akun.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DompetKu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>DompetKu</title>
  <link rel="manifest" href="manifest.json">

  <!-- For whatsapp -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DompetKu">
  <meta property="og:locale" content="id_ID">

  <meta property="og:title" content="DompetKu — Catatan Keuangan Pribadi">

  <meta property="og:description"
    content="Catat pemasukan, pengeluaran, dan kelola dompet pribadi dalam satu aplikasi.">

  <meta property="og:url" content="https://dompetku-etcv1.vercel.app/">

  <meta property="og:image" content="https://dompetku-etcv1.vercel.app/icons/Icon-512.png">

  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Logo DompetKu">
</head>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="boot" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="72" height="72">
    <div class="spinner"></div>
    <p class="slow">Memuat DompetKu lebih lama dari biasa. Periksa koneksi internet, lalu muat ulang halaman.</p>
  </div>
  <script>
    (function () {
      function hideBoot() {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
      }
      window.addEventListener('flutter-first-frame', hideBoot, { once: true });
      document.addEventListener('flutter-first-frame', hideBoot, { once: true });
    })();
  </script>
  <script src="bill_notifications.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
